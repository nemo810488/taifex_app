name: Build TAIFEX dashboard

on:
  schedule:
    - cron: '30 10 * * 1-5'   # 18:30 Taiwan time, Mon-Fri
    - cron: '0 14 * * 1-5'    # 22:00 Taiwan time, Mon-Fri (retry if TAIFEX posted late)
  workflow_dispatch:          # lets you press "Run workflow" manually
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build page
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
